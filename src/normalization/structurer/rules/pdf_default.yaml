header_regexes:
  - "^\\s*저작권법\\s*$"

footer_regexes:
  - "^\\s*법제처\\s+\\d+\\s+국가법령정보센터\\s*$"

header_max_lines: 3
footer_max_lines: 3
repeat_ratio: 0.8
preserve_repeated: true
preserve_repeated_mode: first
preserve_header_footer: header_only
header_tag: header
footer_tag: footer
sentence_end_patterns:
  - '\.$'
  - '!$'
  - '\?$'
  - '다\.$'
  - '요\.$'
heading_split:
  enabled: true
  patterns:
    - '^제\d+장\s+.*$'
    - '^제\d+절\s+.*$'
    - '^제\d+관\s+.*$'
    - '^제\d+조(의\d+)?[(]'
  inline_patterns:
    - '제\d+장\s+'
    - '제\d+절\s+'
    - '제\d+관\s+'
    - '제\d+조(의\d+)?[(]'
list_split:
  enabled: true
  inline_patterns:
    - '(?:^|\s)[가-힣]\.(?=\s*[가-힣])'
    - '[①-⑳]'
  start_patterns:
    - '^\d{1,3}(?:의\d{1,3})?\.'
    - '^[가-힣]\.'
    - '^[①-⑳]'
article_list_split:
  enabled: true
  patterns:
    - '\s(?:\d{1,3}(?:의\d{1,3})?\.(?=\s*[^\d])|[①-⑳])'
  skip_if_angle_brackets: true
exceptions:
  disable_heading_after:
    - '^제11장\s+벌칙'
merge_space:
  enabled: true
  join_single_syllable: true
  keep_space_tokens:
    - '및'
    - '과'
    - '와'
    - '또'
    - '또는'
    - '혹은'
  no_join_prefixes:
    - '제'
  require_prev_hangul: true
  require_next_hangul: true
color_handling:
  accept_hex: true
  accept_rgb_list: true
  accept_numbers: false
group_id:
  enabled: true
  open_patterns:
    - "<"
    - "\\["
  close_patterns:
    - ">"
    - "\\]"
  merge_sentence:
    enabled: true
    sentence_end_patterns:
      - '\.$'
      - '!$'
      - '\?$'
      - '다\.$'
      - '요\.$'
    block_if_next_matches:
      - '^(?:제|\d{1,3}(?:의\d{1,3})?\.)'
      - '^[가-힣]\.'
      - '^[①-⑳]'
    next_start_hangul: true
heading_min_font_size: 14
bold_font_patterns:
  - '(?i)bold'
  - '(?i)bd'
italic_font_patterns:
  - '(?i)italic'
  - '(?i)it'
underline_font_patterns: []
