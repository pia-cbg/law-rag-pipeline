replace:
  - from: "【"
    to: "["
  - from: "】"
    to: "]"

regex:
  # 조문 헤더(제 1 조【 목 적 】 → 제1조 [목적])
  - pattern: '제\s*([0-9]+)\s*조\s*\[?\s*([^\]]+)\s*\]?'
    replace: '제\1조 [\2]'
  # 괄호 내부·양끝 공백 제거
  - pattern: '(\[)\s*([^\[\]]+?)\s*\]'
    replace: '[\2]'
  # 두 번 이상 연속 공백 → 하나(문서 전체 깨끗하게)
  - pattern: '\s{2,}'
    replace: ' '
  # 특수케이스: 본 문서에서 run.color=[255,255,255] (흰색글씨)로 들어온 .y 등 노이즈가 추출되어
  # 텍스트 마지막에 .y 패턴으로 남는 문제 대응용.
  # 향후 다른 문서에서 의미있는 .x, .y, .z 등이 실제 의미로 쓰일 때는 이 부분 정책 점검 필요.
  - pattern: '\.[a-zA-Z]$'
    replace: '.'
  # 원화 표기
  - pattern: '\\'
    replace: '₩'
  # 전화번호 마스킹 -> 개인정보 포함 필요시 주석처리
  - pattern: '01[016789]-\d{3,4}-\d{4}'
    replace: '01*-****-****'
  # 성명 마스킹 -> 개인정보 포함 필요시 주석처리
  - pattern: '([가-힣])대표(?=\(이하 *[“"]?[갑을][”"]?이라 *한다\))'
    replace: '\1**'
  # 회사명 마스킹 -> 개인정보 포함 필요시 주석처리
  - pattern: '클린주식회사'
    replace: 'A사'
  - pattern: '사용주식회사'
    replace: 'B사'

  # 표 데이터 마스킹
  # 성명 마스킹 -> 개인정보 포함 필요시 주석처리
  - pattern: '([가-힣])\s+[가-힣]\s+[가-힣]\s*\(인\)'
    replace: '\1 * * (인)'
  - pattern: '([가-힣])\s+[가-힣]\s*\(인\)'
    replace: '\1 * (인)'
  # 회사 마스킹 -> 개인정보 포함 필요시 주석처리
  - pattern: '\(주\)\s*([가-힣]{2,})'
    replace: '(주)****'
